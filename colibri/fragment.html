<style>
  #favr-colibri-nav {
    box-sizing: border-box;
    width: 100%;
    background: #f8f4f2;
    font-family: 'Merriweather Sans', 'Helvetica Neue', Arial, sans-serif;
  }
  #favr-colibri-nav * {
    box-sizing: border-box;
  }
  #favr-colibri-nav .favr-frame {
    width: 1300px;
    max-width: 100%;
    margin: 0 auto;
    background: #064597;
  }
  #favr-colibri-nav .favr-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    height: 92px;
    padding: 0 32px;
  }
  #favr-colibri-nav .favr-logo {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  #favr-colibri-nav .favr-logo img {
    height: 39px;
    width: auto;
    display: block;
  }
  #favr-colibri-nav .favr-links {
    display: flex;
    align-items: center;
    justify-content: space-between;
    list-style: none;
    margin: 0;
    padding: 0;
    flex: 1;
    flex-wrap: wrap;
  }
  #favr-colibri-nav .favr-links li {
    margin-right: 0;
  }
  #favr-colibri-nav .favr-links a {
    display: block;
    color: #ffffff;
    text-decoration: none;
    font-family: 'Merriweather Sans', 'Helvetica Neue', Arial, sans-serif;
    font-size: 16px;
    font-weight: 400;
    white-space: nowrap;
  }
  #favr-colibri-nav .favr-links a:hover {
    text-decoration: underline;
  }

  /* Burger menu, hidden on desktop */
  #favr-colibri-burger-toggle {
    display: none;
  }
  #favr-colibri-nav .favr-burger-label {
    display: none;
  }
  #favr-colibri-nav .favr-mobile-panel {
    display: none;
  }

  @media (max-width: 1100px) {
    #favr-colibri-nav .favr-links {
      display: none;
    }
    #favr-colibri-nav .favr-burger-label {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 28px;
      height: 28px;
      cursor: pointer;
    }
    #favr-colibri-nav .favr-burger-label span {
      display: block;
      width: 24px;
      height: 2px;
      background: #ffffff;
    }
    #favr-colibri-burger-toggle:checked ~ .favr-frame .favr-mobile-panel {
      display: block;
    }
    #favr-colibri-nav .favr-mobile-panel {
      background: #053a80;
      border-top: 1px solid rgba(255,255,255,0.15);
    }
    #favr-colibri-nav .favr-mobile-links {
      list-style: none;
      margin: 0;
      padding: 10px 0 14px;
    }
    #favr-colibri-nav .favr-mobile-links > li {
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    #favr-colibri-nav .favr-mobile-links a {
      display: block;
      color: #ffffff;
      text-decoration: none;
      font-family: 'Merriweather Sans', 'Helvetica Neue', Arial, sans-serif;
      font-size: 16px;
      font-weight: 400;
      padding: 12px 32px;
    }
  }
</style>
