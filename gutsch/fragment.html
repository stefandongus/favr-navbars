<nav id="favr-gutsch-nav">
  <style>
    #favr-gutsch-nav {
      font-family: 'Poppins', 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
      background: #67929F;
      width: 100%;
    }
    #favr-gutsch-nav * { box-sizing: border-box; }
    #favr-gutsch-nav a { text-decoration: none; }
    #favr-gutsch-nav .favr-inner {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      height: 75px;
      width: 1200px;
      max-width: 100%;
      margin: 0 auto;
      padding: 0 40px;
    }
    #favr-gutsch-nav .favr-logo {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    #favr-gutsch-nav .favr-logo img { display: block; height: 51px; width: auto; }

    #favr-gutsch-nav .favr-right {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      margin-left: auto;
    }

    #favr-gutsch-nav .favr-links {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      margin-right: 40px;
    }
    #favr-gutsch-nav .favr-links a {
      color: #252D2F;
      font-weight: 400;
      font-size: 14px;
      white-space: nowrap;
      margin-right: 32px;
    }
    #favr-gutsch-nav .favr-links a:last-child { margin-right: 0; }
    #favr-gutsch-nav .favr-links a:hover { opacity: 0.7; }

    #favr-gutsch-nav .favr-cta {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      background: #F7E0D3;
      color: #252D2F;
      font-weight: 600;
      font-size: 10px;
      letter-spacing: 1.5px;
      padding: 12px 22px;
      white-space: nowrap;
    }
    #favr-gutsch-nav .favr-cta svg { width: 14px; height: 14px; margin-left: 8px; flex-shrink: 0; }

    /* burger for mobile */
    #favr-gutsch-burger-toggle { display: none; }
    #favr-gutsch-nav .favr-burger-label {
      display: none;
      flex-direction: column;
      justify-content: center;
      width: 28px;
      height: 28px;
      cursor: pointer;
      margin-left: auto;
    }
    #favr-gutsch-nav .favr-burger-label span {
      display: block;
      width: 24px;
      height: 2px;
      background: #252D2F;
      margin: 3px 0;
    }
    #favr-gutsch-nav .favr-mobile-panel { display: none; }

    @media (max-width: 860px) {
      html { scroll-padding-top: 60px; }
      #favr-gutsch-nav .favr-inner { height: 60px; padding: 0 20px; position: relative; }
      #favr-gutsch-nav .favr-logo img { height: 36px; }
      #favr-gutsch-nav .favr-links { display: none; }
      #favr-gutsch-nav .favr-cta { display: none; }
      #favr-gutsch-nav .favr-burger-label { display: flex; }
      #favr-gutsch-nav .favr-mobile-panel {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: #67929F;
        border-top: 1px solid rgba(0,0,0,0.15);
        padding: 10px 0;
        z-index: 40;
      }
      #favr-gutsch-nav .favr-mobile-panel a {
        display: block;
        padding: 12px 20px;
        color: #252D2F;
        font-weight: 400;
        font-size: 15px;
      }
      #favr-gutsch-nav .favr-mobile-panel .favr-mobile-cta {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 10px 20px 4px;
        background: #F7E0D3;
        color: #252D2F;
        font-weight: 600;
        font-size: 10px;
        letter-spacing: 1.5px;
        padding: 12px 18px;
      }
      #favr-gutsch-nav .favr-mobile-panel .favr-mobile-cta svg { width: 14px; height: 14px; margin-left: 8px; }
      #favr-gutsch-burger-toggle:checked ~ .favr-inner .favr-mobile-panel { display: block; }
    }
  </style>
