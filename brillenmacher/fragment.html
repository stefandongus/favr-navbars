<style>
  #favr-brillenmacher-nav {
    box-sizing: border-box;
    width: 100%;
    background: #f2f1ef;
    font-family: 'San de More-Bold', 'Playfair Display', Georgia, 'Times New Roman', serif;
  }
  #favr-brillenmacher-nav * {
    box-sizing: border-box;
  }
  #favr-brillenmacher-nav .favr-outer {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 90px;
    border-bottom: 1px solid #53616c;
  }
  #favr-brillenmacher-nav .favr-links {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 1400px;
    max-width: 100%;
    padding: 0 24px;
    list-style: none;
    margin: 0;
  }
  #favr-brillenmacher-nav .favr-links a {
    display: block;
    color: #53616c;
    text-decoration: none;
    font-family: 'San de More-Bold', 'Playfair Display', Georgia, 'Times New Roman', serif;
    font-size: 18px;
    font-weight: 100;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
    transform: scaleY(1.25);
    transform-origin: center;
  }
  #favr-brillenmacher-nav .favr-links a:hover {
    text-decoration: underline;
  }
  #favr-brillenmacher-nav .favr-logo {
    display: flex;
    align-items: flex-start;
    padding-top: 18px;
    flex-shrink: 0;
  }
  #favr-brillenmacher-nav .favr-logo img {
    height: 34px;
    width: auto;
    display: block;
  }

  /* Burger menu, hidden on desktop */
  #favr-brillenmacher-burger-toggle {
    display: none;
  }
  #favr-brillenmacher-nav .favr-burger-label {
    display: none;
  }
  #favr-brillenmacher-nav .favr-mobile-panel {
    display: none;
  }

  @media (max-width: 1450px) {
    #favr-brillenmacher-nav .favr-outer {
      justify-content: space-between;
      padding: 0 24px;
      position: relative;
    }
    #favr-brillenmacher-nav .favr-links {
      display: none;
    }
    #favr-brillenmacher-nav .favr-logo {
      padding-top: 6px;
    }
    #favr-brillenmacher-nav .favr-burger-label {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 40px;
      height: 40px;
      margin-left: auto;
      cursor: pointer;
    }
    #favr-brillenmacher-nav .favr-burger-label span {
      display: block;
      width: 20px;
      height: 2px;
      background: #000000;
      margin: 2.5px 0;
    }
    #favr-brillenmacher-burger-toggle:checked ~ .favr-outer .favr-mobile-panel {
      display: block;
    }
    #favr-brillenmacher-nav .favr-mobile-panel {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      background: #f2f1ef;
      border-top: 1px solid #53616c;
      z-index: 30;
    }
    #favr-brillenmacher-nav .favr-mobile-links {
      list-style: none;
      margin: 0;
      padding: 10px 0 16px;
    }
    #favr-brillenmacher-nav .favr-mobile-links > li {
      border-bottom: 1px solid rgba(83,97,108,0.15);
    }
    #favr-brillenmacher-nav .favr-mobile-links a {
      display: block;
      color: #53616c;
      text-decoration: none;
      font-family: 'San de More-Bold', 'Playfair Display', Georgia, 'Times New Roman', serif;
      font-size: 18px;
      font-weight: 100;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 12px 24px;
      transform: scaleY(1.25);
      transform-origin: left center;
    }
  }
</style>
