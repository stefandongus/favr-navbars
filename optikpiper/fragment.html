<style>
  #favr-optikpiper-nav {
    box-sizing: border-box;
    width: 100%;
    background: #000000;
    font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
  }
  #favr-optikpiper-nav * {
    box-sizing: border-box;
  }
  #favr-optikpiper-nav .favr-inner {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    height: 218px;
    padding: 0 40px;
  }

  #favr-optikpiper-nav .favr-burger-wrap {
    grid-column: 1;
    grid-row: 1;
    justify-self: start;
    padding-left: 415px;
  }
  #favr-optikpiper-burger-toggle {
    display: none;
  }
  #favr-optikpiper-nav .favr-burger-label {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    width: 30px;
    height: 24px;
    cursor: pointer;
  }
  #favr-optikpiper-nav .favr-burger-label span {
    display: block;
    width: 30px;
    height: 3px;
    background: #ffffff;
  }

  #favr-optikpiper-nav .favr-logo {
    grid-column: 2;
    grid-row: 1;
    justify-self: center;
    display: flex;
    align-items: center;
    text-decoration: none;
  }
  #favr-optikpiper-nav .favr-logo img {
    width: 318px;
    height: auto;
    display: block;
  }

  #favr-optikpiper-nav .favr-right {
    grid-column: 3;
    grid-row: 1;
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 22px;
    padding-right: 408px;
  }
  #favr-optikpiper-nav .favr-social {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  #favr-optikpiper-nav .favr-social a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #ffffff;
    color: #000000;
  }
  #favr-optikpiper-nav .favr-social svg {
    width: 22px;
    height: 22px;
    fill: #000000;
  }
  #favr-optikpiper-nav .favr-cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid #ffffff;
    border-radius: 999px;
    padding: 12px 26px;
    color: #ffffff;
    text-decoration: none;
    font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
    font-size: 17px;
    font-weight: 500;
    white-space: nowrap;
  }
  #favr-optikpiper-nav .favr-cta:hover {
    background: #ffffff;
    color: #000000;
  }

  /* Dropdown menu triggered by burger, slides in as overlay panel */
  #favr-optikpiper-nav .favr-mobile-panel {
    display: none;
  }
  #favr-optikpiper-burger-toggle:checked ~ .favr-inner .favr-mobile-panel {
    display: block;
  }
  #favr-optikpiper-nav .favr-mobile-panel {
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    background: #000000;
    border-top: 1px solid #333333;
    z-index: 30;
  }
  #favr-optikpiper-nav {
    position: relative;
  }
  #favr-optikpiper-nav .favr-mobile-links {
    list-style: none;
    margin: 0;
    padding: 20px 40px;
  }
  #favr-optikpiper-nav .favr-mobile-links > li {
    border-bottom: 1px solid #222222;
  }
  #favr-optikpiper-nav .favr-mobile-links a {
    display: block;
    color: #ffffff;
    text-decoration: none;
    font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
    font-size: 16px;
    font-weight: 400;
    padding: 14px 4px;
  }
  #favr-optikpiper-nav .favr-mobile-links a:hover {
    color: #cb171c;
  }

  @media (max-width: 1400px) {
    #favr-optikpiper-nav .favr-burger-wrap {
      padding-left: 40px;
    }
    #favr-optikpiper-nav .favr-right {
      padding-right: 40px;
    }
  }
  @media (max-width: 1200px) {
    #favr-optikpiper-nav .favr-logo {
      grid-column: 3;
      grid-row: 1;
      justify-self: end;
    }
    #favr-optikpiper-nav .favr-right {
      display: none;
    }
  }
  @media (max-width: 600px) {
    #favr-optikpiper-nav .favr-inner {
      height: 90px;
    }
    #favr-optikpiper-nav .favr-logo img {
      width: 200px;
    }
    #favr-optikpiper-nav .favr-social {
      display: none;
    }
    #favr-optikpiper-nav .favr-cta {
      font-size: 12px;
      padding: 8px 14px;
    }
  }
</style>
