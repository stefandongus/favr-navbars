<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@200;300;400;500&display=swap');

  /* =============================================
     FAVR Header Fragment – Bartlomé Optik (Olten)
     Logobar 95px (weiß, Logo+Burger mittig/rechts)
     Navbar 36px (hellgrau, 4 Punkte zentriert)
     Burger: voller 8-Punkte-Drawer
     ============================================= */

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  #favr-burger-toggle { display: none !important; width: 0 !important; overflow: hidden !important; }

  .favr-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 2000; cursor: pointer;
  }
  #favr-burger-toggle:checked ~ .favr-overlay { display: block; }
  #favr-burger-toggle:checked ~ .favr-drawer { right: 0; }

  /* Drawer */
  .favr-drawer {
    position: fixed; top: 0; right: -320px;
    width: 300px; max-width: 88vw; height: 100vh;
    background: #ffffff;
    z-index: 2001; display: flex; flex-direction: column;
    overflow-y: auto; box-shadow: -4px 0 24px rgba(0,0,0,0.18);
    transition: right 0.28s ease;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
  .favr-drawer__head {
    display: flex; align-items: center; justify-content: flex-end;
    padding: 16px 16px 4px;
  }
  .favr-drawer__close {
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 50%; background: #000000; flex-shrink: 0;
  }
  .favr-drawer__close svg { width: 18px; height: 18px; fill: none; stroke: #ffffff; stroke-width: 2; stroke-linecap: round; }
  .favr-drawer__nav { padding: 10px 0; }
  .favr-drawer__nav a {
    display: flex; align-items: center; justify-content: space-between;
    color: #1a1a1a; text-decoration: none;
    font-size: 16px; font-weight: 400; padding: 15px 20px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .favr-drawer__nav a:hover { background: rgba(0,0,0,0.03); }
  .favr-drawer__nav a svg { width: 14px; height: 14px; stroke: #9a9a9a; fill: none; stroke-width: 2; flex-shrink: 0; }
  .favr-drawer__nav a.favr-blog { color: #1a6fd1; }

  /* Logobar */
  .favr-logobar { width: 100%; min-height: 95px; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  .favr-logobar__inner {
    width: 100%; min-height: 95px; margin: 0 auto;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: 20px; padding: 10px 30px;
  }
  .favr-logobar__spacer { grid-column: 1; }
  .favr-logobar__logo { display: block; text-decoration: none; grid-column: 2; justify-self: center; }
  .favr-logobar__logo-img { height: 92px; width: auto; display: block; }

  .favr-logobar__burger {
    grid-column: 3; justify-self: end; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border-radius: 50%; background: #000000;
    flex-shrink: 0;
  }
  .favr-logobar__burger-lines { display: flex; flex-direction: column; gap: 5px; width: 26px; }
  .favr-logobar__burger-lines span { display: block; height: 2.6px; width: 100%; background: #ffffff; }

  /* Navbar (untere schmale Leiste) */
  .favr-navbar { width: 100%; min-height: 36px; background: #E0E0E0; padding: 6px 0; }
  .favr-navbar__inner {
    width: 100%; height: 100%; margin: 0 auto;
    display: flex; align-items: center; justify-content: center;
    gap: 34px;
  }
  .favr-navbar__inner a {
    color: #000000; text-decoration: none;
    font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size: 17px; font-weight: 200;
    white-space: nowrap; transition: opacity 0.15s;
  }
  .favr-navbar__inner a:hover { opacity: 0.6; }
  .favr-navbar__inner a.favr-active { color: #000000; font-weight: 200; }

  /* ===== Breakpoint: <760px – untere Navbar ausblenden ===== */
  /* ===== Breakpoint: <650px – Abstände enger, Nav bleibt sichtbar ===== */
  @media (max-width: 650px) {
    .favr-navbar__inner { gap: 16px; }
    .favr-navbar__inner a { font-size: 14px; }
  }

  /* ===== Breakpoint: <480px – untere Navbar ausblenden ===== */
  @media (max-width: 480px) {
    .favr-navbar { display: none; }
    .favr-logobar { min-height: 74px; }
    .favr-logobar__inner { min-height: 74px; padding: 8px 18px; }
    .favr-logobar__logo-img { height: 69px; }
    .favr-logobar__burger { width: 38px; height: 38px; }
  }
</style>
