<style>
  #favr-brillenglaserei-nav {
    box-sizing: border-box;
    width: 100%;
    background: #000000;
    font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
  }
  #favr-brillenglaserei-nav * {
    box-sizing: border-box;
  }

  #favr-brillenglaserei-nav .favr-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 20px 32px;
    position: relative;
  }

  #favr-brillenglaserei-burger-toggle {
    display: none;
  }
  #favr-brillenglaserei-nav .favr-logo-toggle {
    display: flex;
    align-items: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  #favr-brillenglaserei-nav .favr-logo-toggle img {
    height: 53px;
    width: auto;
    display: block;
  }

  #favr-brillenglaserei-nav .favr-infolinks {
    display: flex;
    align-items: center;
    gap: 28px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  #favr-brillenglaserei-nav .favr-infolinks a,
  #favr-brillenglaserei-nav .favr-infolinks span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #ffffff;
    text-decoration: none;
    font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
    font-size: 18px;
    font-weight: 400;
    white-space: nowrap;
  }
  #favr-brillenglaserei-nav .favr-infolinks a:hover {
    text-decoration: underline;
  }
  #favr-brillenglaserei-nav .favr-infolinks svg {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
  }

  #favr-brillenglaserei-nav .favr-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 32px;
    background: #000000;
    border: 1px solid #222222;
    min-width: 280px;
    padding: 10px 0;
    z-index: 30;
  }
  #favr-brillenglaserei-burger-toggle:checked ~ .favr-bar .favr-dropdown {
    display: block;
  }
  #favr-brillenglaserei-nav .favr-dropdown ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  #favr-brillenglaserei-nav .favr-dropdown a {
    display: block;
    color: #ffffff;
    text-decoration: none;
    font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 12px 24px;
  }
  #favr-brillenglaserei-nav .favr-dropdown a:hover {
    background: #1a1a1a;
  }

  @media (max-width: 700px) {
    #favr-brillenglaserei-nav .favr-bar {
      flex-wrap: wrap;
      padding: 16px 20px;
    }
    #favr-brillenglaserei-nav .favr-logo-toggle img {
      height: 42px;
    }
    #favr-brillenglaserei-nav .favr-infolinks {
      justify-content: center;
      gap: 10px 20px;
      width: 100%;
      order: 3;
    }
    #favr-brillenglaserei-nav .favr-dropdown {
      left: 20px;
      right: 20px;
      min-width: 0;
    }
  }
</style>
