<style>
  html {
    scroll-padding-top: 180px;
  }
  #favr-diebrille-nav {
    box-sizing: border-box;
    width: 100%;
    background: #ffffff;
    font-family: 'Source Sans Pro', Arial, Helvetica, sans-serif;
  }
  #favr-diebrille-nav * {
    box-sizing: border-box;
  }
  #favr-diebrille-nav .favr-inner {
    display: flex;
    align-items: center;
    height: 180px;
    padding: 0 40px 0 0;
  }
  #favr-diebrille-nav .favr-logo {
    display: flex;
    align-items: center;
    align-self: flex-start;
    flex-shrink: 0;
    margin-right: auto;
    padding: 40px 0 0 85px;
  }
  #favr-diebrille-nav .favr-logo img {
    height: 100px;
    width: auto;
    display: block;
  }
  #favr-diebrille-nav .favr-links {
    display: flex;
    align-items: center;
    align-self: flex-start;
    list-style: none;
    margin: 0;
    padding: 37px 0 0 0;
    flex-wrap: wrap;
  }
  #favr-diebrille-nav .favr-links li {
    margin-right: 28px;
  }
  #favr-diebrille-nav .favr-links a {
    display: block;
    color: #515b69;
    text-decoration: none;
    font-family: 'Source Sans Pro', Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
  }
  #favr-diebrille-nav .favr-links a:hover {
    color: #d74f31;
  }
  #favr-diebrille-nav .favr-cta {
    display: inline-flex;
    align-items: center;
    align-self: flex-start;
    margin-top: 27px;
    gap: 6px;
    background: #73849c;
    color: #ffffff;
    text-decoration: none;
    font-family: 'Source Sans Pro', Arial, Helvetica, sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 10px 18px;
    white-space: nowrap;
  }
  #favr-diebrille-nav .favr-cta:hover {
    background: #5f6f88;
  }
  #favr-diebrille-nav .favr-cta svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  /* Burger menu, hidden on desktop */
  #favr-diebrille-burger-toggle {
    display: none;
  }
  #favr-diebrille-nav .favr-burger-label {
    display: none;
  }
  #favr-diebrille-nav .favr-mobile-panel {
    display: none;
  }

  @media (max-width: 1300px) {
    html {
      scroll-padding-top: 140px;
    }
    #favr-diebrille-nav .favr-inner {
      height: 140px;
      padding: 0 24px 0 0;
      position: relative;
    }
    #favr-diebrille-nav .favr-links,
    #favr-diebrille-nav .favr-cta {
      display: none;
    }
    #favr-diebrille-nav .favr-burger-label {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 28px;
      height: 28px;
      cursor: pointer;
    }
    #favr-diebrille-nav .favr-burger-label span {
      display: block;
      width: 24px;
      height: 2px;
      background: #515b69;
      margin: 3px 0;
    }
    #favr-diebrille-burger-toggle:checked ~ .favr-inner .favr-mobile-panel {
      display: block;
    }
    #favr-diebrille-nav .favr-mobile-panel {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      background: #ffffff;
      border-top: 1px solid #eeeeee;
      z-index: 30;
    }
    #favr-diebrille-nav .favr-mobile-links {
      list-style: none;
      margin: 0;
      padding: 10px 0 16px;
    }
    #favr-diebrille-nav .favr-mobile-links > li {
      border-bottom: 1px solid #f2f2f2;
    }
    #favr-diebrille-nav .favr-mobile-links a {
      display: block;
      color: #515b69;
      text-decoration: none;
      font-family: 'Source Sans Pro', Arial, Helvetica, sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 24px;
    }
    #favr-diebrille-nav .favr-mobile-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 12px 24px 16px;
      background: #73849c;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      padding: 10px 18px;
    }
  }
</style>
